<style>
  :root{
    --bg:#000000;
    --panel:#151515;
    --panel-2:#1c1c1c;
    --line:#2b2b2b;
    --ink:#ffffff;
    --ink-dim:#a3a3a3;
    --ink-faint:#5f5f5f;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  main{
    max-width:600px;
    margin:0 auto;
    padding:64px 24px 56px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:18px;
  }

  .avatar{
    width:72px; height:72px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    border:1px solid var(--line);
    filter:grayscale(1) contrast(1.05);
  }
  .avatar img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .head-text{ min-width:0; }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:23px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .handle{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-faint);
    margin-top:4px;
  }

  /* ---------- Bio ---------- */
  .bio-section{
    margin-top:32px;
    padding:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .bio-section .role{
    font-family:'Sora',sans-serif;
    font-size:15.5px;
    color:var(--ink);
    font-weight:600;
    line-height:1.6;
  }
  .bio-section .sub{
    font-size:14px;
    color:var(--ink-dim);
    margin-top:5px;
    line-height:1.6;
  }

  .stack{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .stack span{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-dim);
    padding:5px 11px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:99px;
  }

  /* ---------- Links ---------- */
  .links{
    margin-top:28px;
  }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:.1em;
    text-transform:uppercase;
    margin-bottom:14px;
    padding-left:2px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:15px;
    padding:16px 17px;
    margin-bottom:9px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:13px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .row:last-child{ margin-bottom:0; }
  .row:hover{
    border-color:#454545;
    background:var(--panel-2);
  }

  .icon{
    flex-shrink:0;
    width:42px; height:42px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    background:var(--panel-2);
    border:1px solid var(--line);
  }
  .icon svg{ width:19px; height:19px; }

  .row-text{ flex:1; min-width:0; }
  .row-label{
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .row-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:2px;
  }

  .go{
    color:var(--ink-faint);
    font-size:16px;
    flex-shrink:0;
    transition:transform .15s ease, color .15s ease;
  }
  .row:hover .go{
    transform:translateX(3px);
    color:var(--ink);
  }

  footer{
    margin-top:36px;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
  }

  @media (max-width:480px){
    main{ padding:48px 18px 40px; }
    .avatar{ width:60px; height:60px; }
  }
</style>
